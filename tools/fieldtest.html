<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>OG키보드 입력칸 시험</title>
<style>
body{font:14px -apple-system,"Apple SD Gothic Neo",sans-serif;max-width:560px;margin:30px auto;color:#222}
h1{font-size:18px} label{display:block;margin:12px 0 4px;color:#555;font-size:12px}
input{width:100%;padding:7px 9px;font-size:14px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
</style></head><body>
<h1>OG키보드 입력칸 시험</h1>
<p>각 칸을 위에서부터 차례로 클릭하십시오. 칸 이름은 일부러 비워 두어 <b>칸 종류(type·inputmode·autocomplete)</b>만으로 구분되는지 확인합니다.</p>
<label>1. type=text (일반)</label><input type="text">
<label>2. type=tel</label><input type="tel">
<label>3. type=number</label><input type="number">
<label>4. type=email</label><input type="email">
<label>5. type=url</label><input type="url">
<label>6. type=date</label><input type="date">
<label>7. type=search</label><input type="search">
<label>8. inputmode=numeric</label><input type="text" inputmode="numeric">
<label>9. inputmode=tel</label><input type="text" inputmode="tel">
<label>10. autocomplete=cc-number</label><input type="text" autocomplete="cc-number">
<label>11. autocomplete=one-time-code</label><input type="text" autocomplete="one-time-code">
<label>12. style ime-mode:disabled (옛 한국 사이트 방식)</label><input type="text" style="ime-mode:disabled">
<label>13. pattern=[0-9]*</label><input type="text" pattern="[0-9]*">
<label>14. maxlength=4 (휴대폰 가운데 칸 흉내)</label><input type="text" maxlength="4" size="4">
</body></html>
